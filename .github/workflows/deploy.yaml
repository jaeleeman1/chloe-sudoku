name: Deploy Chloe Sudoku via Desktop Runner

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted  # <-- 내 데스크탑 러너에서 수행!

    steps:
    # 1. 소스 코드 가져오기
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 데스크탑의 Flutter 환경으로 초고속 Web 빌드
    - name: Build Flutter Web
      run: |
        $env:Path += ";C:\sdk\flutter\bin"
        flutter pub get
        flutter build web --base-href "/sudoku/"

    # 3. 내 내부망(LAN)을 통해 라즈베리파이로 1초 만에 파일 전송
    - name: Deploy to Raspberry Pi
      run: |
        scp -r build/web/* felix530@192.168.55.82:/var/www/sudoku/