name: Build & Deploy Chloe Sudoku to N100 Mini PC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    # 1. 소스 코드 가져오기
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 데스크탑의 Flutter 환경으로 초고속 Web 빌드
    - name: Build Flutter Web
      run: |
        $env:Path += ";C:\sdk\flutter\bin"
        flutter pub get
        flutter build web --base-href "/sudoku/"

    # 3. N100 미니 PC로 빌드 결과물(build/web/*) SSH/SCP 자동 전송
    - name: Deploy build/web to N100 Mini PC
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.N100_HOST }}
        username: ${{ secrets.N100_USER }}
        key: ${{ secrets.N100_SSH_KEY }}
        port: ${{ secrets.N100_PORT }}
        source: "build/web/*"
        target: "/home/felix530/project/sudoku-web"
        strip_prefix: "build/web"

    # 4. N100 미니 PC의 Docker 컨테이너 재시작
    - name: Restart N100 Docker Container
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.N100_HOST }}
        username: ${{ secrets.N100_USER }}
        key: ${{ secrets.N100_SSH_KEY }}
        port: ${{ secrets.N100_PORT }}
        script: |
          docker restart chloe-sudoku