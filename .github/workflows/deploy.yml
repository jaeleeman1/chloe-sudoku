name: Build & Deploy Chloe Sudoku to N100 Mini PC

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted # 내 데스크탑(FELIX) 러너 사용 - GitHub 클라우드 결제 제한 100% 우회!

    steps:
    # 1. GitHub에서 소스 코드 가져오기
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 내 데스크탑 i9 CPU로 3초 만에 Flutter Web 빌드
    - name: Build Flutter Web
      run: |
        $env:Path += ";C:\sdk\flutter\bin"
        flutter pub get
        flutter build web --base-href "/sudoku/"

    # 3. N100 미니 PC로 빌드 결과물(build/web/*) SCP 자동 전송
    - name: Deploy build/web to N100 Mini PC
      run: |
        scp -r build/web/* felix530@192.168.35.137:/home/felix530/sudoku-web/

    # 4. N100 미니 PC의 Docker 컨테이너 재시작
    - name: Restart N100 Docker Container
      run: |
        ssh felix530@192.168.35.137 "docker restart chloe-sudoku"
