name: Build & Deploy Chloe Sudoku to N100 Mini PC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub 클라우드 무료 서버 사용 (내 데스크탑 러너 필요 없음!)

    steps:
    # 1. 소스 코드 가져오기
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Java 환경 설정
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Flutter SDK 설치
    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.2'
        channel: 'stable'

    # 4. Flutter Web 앱 빌드 (--base-href "/sudoku/")
    - name: Build Flutter Web
      run: |
        flutter pub get
        flutter build web --base-href "/sudoku/"

    # 5. N100 미니 PC로 빌드 결과물(build/web/**) 재귀 하위 폴더 전체 SSH/SCP 자동 전송
    - name: Deploy build/web to N100 Mini PC
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.N100_HOST }}
        username: ${{ secrets.N100_USER }}
        key: ${{ secrets.N100_SSH_KEY }}
        port: ${{ secrets.N100_PORT }}
        source: "build/web/**"
        target: "/home/felix530/project/sudoku-web"
        strip_prefix: "build/web"

    # 6. N100 미니 PC의 Docker 컨테이너 재시작
    - name: Restart N100 Docker Container
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.N100_HOST }}
        username: ${{ secrets.N100_USER }}
        key: ${{ secrets.N100_SSH_KEY }}
        port: ${{ secrets.N100_PORT }}
        script: |
          docker restart chloe-sudoku
